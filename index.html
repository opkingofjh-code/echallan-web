<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eChallan Admin - Login</title>
  <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body class="login-body">
  <div class="login-container">
    <div class="login-header">
      <div class="logo-circle">🔐</div>
      <h1>eChallan Admin</h1>
      <p>Web Control Panel</p>
    </div>

    <form id="loginForm">
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="admin@example.com" required>
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-3d" id="loginBtn">LOGIN</button>
      <p id="errorMsg" class="error-msg"></p>
    </form>

    <p class="footer-text">© 2024 eChallan Admin</p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
